<div class="app-container">
  <nav class="navbar">
    <div class="nav-brand">Music Retailer System</div>
    <div class="nav-menu">
      <button class="nav-btn" *ngIf="!isLoggedIn()" (click)="router.navigate(['/login'])">
        Login
      </button>
      <button class="nav-btn" (click)="router.navigate(['/records'])" [disabled]="!isLoggedIn()">
        Records
      </button>
      <button class="nav-btn" (click)="router.navigate(['/add-records'])" [disabled]="!canAddRecords()">
        Add records
      </button>
    </div>
    <div class="nav-status" *ngIf="isLoggedIn()">
      <span class="user-info">
        <strong>{{ authService.getCurrentRole() }}</strong>
      </span>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
